<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI CHAT · Aldetic Frontiers</title>
<meta name="description" content="Aldetic Frontiers Ltd : Technology Beyond Limits.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600&family=IBM+Plex+Sans:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
</head>
<body data-protected="true">
<div id="site-header"></div>
<main>
<section class="h-hero" style="padding-bottom:24px">
  <div class="wrap">
    <p class="eyebrow">AI CHAT</p>
    <h1 style="font-size:clamp(36px,4.6vw,54px)">Posez une question.</h1>
    <p class="lead" style="margin-top:14px">Un assistant pour répondre aux questions et expliquer le code.</p>
  </div>
</section>
<section style="padding-top:8px">
  <div class="wrap" style="max-width:860px">
    <div class="panel" style="display:flex;flex-direction:column;min-height:420px;padding:0;overflow:hidden">
      <div style="padding:14px 18px;border-bottom:1px solid var(--glass-edge);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
        <div class="field" style="margin:0;min-width:200px"><label for="model" style="font-size:13px">Modèle</label><select id="model" disabled><option>À confirmer</option></select></div>
        <button class="btn small ghost" id="newchat" type="button">Nouveau chat</button>
      </div>
      <div id="msgs" style="flex:1;padding:20px;display:grid;gap:12px;align-content:start"><div class="empty">L'assistant n'est pas encore disponible. Aucune réponse n'est générée tant que le service n'est pas configuré.</div></div>
      <form id="chatf" style="display:flex;gap:10px;padding:14px;border-top:1px solid var(--glass-edge)">
        <label for="ci" class="sr">Votre question</label>
        <input id="ci" placeholder="Votre question…" disabled style="flex:1">
        <button class="btn primary" type="submit" disabled>Envoyer</button>
      </form>
    </div>
    <p class="muted" style="font-size:14px;margin-top:14px">Les limites d'utilisation et la liste des modèles seront affichées ici une fois confirmées.</p>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/i18n-en.js"></script>
<script src="assets/js/i18n-es.js"></script>
<script src="assets/js/i18n-pt.js"></script>
<script src="assets/js/i18n-ar.js"></script>
<script src="assets/js/i18n-de.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/ask-ai.js"></script>
</body>
</html>
