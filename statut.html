<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Statut des services · Aldetic Frontiers</title><meta name="description" content="Retrouvez vos alertes et définissez les événements pour lesquels vous souhaitez être informé."><link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/base.css"><script>try{var t=localStorage.getItem('aldetic-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script></head>
<body data-protected="false"><div id="site-header"></div><main>
<section class="h-hero" style="padding-bottom:30px"><div class="wrap"><img class="hero-art" src="assets/brand/illustrations/check.svg" alt="" width="150" height="131" loading="lazy"><p class="eyebrow">Statut</p><h1 style="font-size:clamp(34px,5vw,58px)">État des services Aldetic.</h1><p class="lead" style="margin-top:18px">Disponibilité de chaque service, mise à jour par l'équipe. La page se rafraîchit toute seule.</p></div></section>
<section style="padding-top:12px"><div class="wrap">
<div id="overall" class="notice" role="status" hidden></div>
<div class="panel" style="margin-top:18px"><div id="services"></div><p class="muted" style="margin-top:12px;font-size:13px">Dernière vérification : <span id="checked">—</span></p></div>
</div></section>
</main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js"></script><script src="assets/js/supabase.js"></script>
<script src="assets/js/i18n-en.js"></script><script src="assets/js/i18n-es.js"></script><script src="assets/js/i18n-pt.js"></script><script src="assets/js/i18n-ar.js"></script><script src="assets/js/i18n-de.js"></script>
<script src="assets/js/table.js"></script><script src="assets/js/app.js"></script><script src="assets/js/motion.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/ask-ai.js"></script><script>
document.addEventListener("aldetic:ready", async () => {
  const db = window.aldeticDb, $ = id => document.getElementById(id);
  const ST = { operational: ["Opérationnel", "var(--ok)", "var(--ok-bg)"], degraded: ["Dégradé", "var(--warn)", "var(--warn-bg)"], maintenance: ["Maintenance", "var(--warn)", "var(--warn-bg)"], outage: ["Panne", "var(--err)", "var(--err-bg)"] };
  let table = null;
  const RANK = { operational: 0, maintenance: 1, degraded: 2, outage: 3 };
  const fmt = d => new Date(d).toLocaleString(document.documentElement.lang);
  async function load() {
    if (!db) { $("overall").textContent = tr("Le service de comptes n'est pas configuré."); $("overall").hidden = false; return; }
    const { data, error } = await db.from("service_status").select("service_key, label, status, message, updated_at").order("label");
    if (error) { $("overall").textContent = tr("Impossible de charger le statut. Réessayez."); $("overall").hidden = false; return; }
    const rows = data || [];
    if (!table) table = alTable($("services"), { pageSize: 10, search: ["label"], empty: tr("Aucun service n'est enregistré pour le moment."), columns: [
      { key: "label", label: "Service", sort: true, render: r => `<b>${esc(r.label)}</b>${r.message ? `<span class="dt-sub">${esc(r.message)}</span>` : ""}` },
      { key: "status", label: "État", sort: true, render: r => { const st = ST[r.status] || ST.operational; return `<span class="tag" style="color:${st[1]};background:${st[2]}">${esc(tr(st[0]))}</span>`; } },
      { key: "updated_at", label: "Mis à jour", sort: true, align: "right", render: r => esc(fmt(r.updated_at)) }] });
    table.setRows(rows);
    const worst = rows.reduce((w, r) => (RANK[r.status] > RANK[w] ? r.status : w), "operational");
    const o = $("overall");
    if (rows.length) { o.textContent = worst === "operational" ? tr("Tous les services fonctionnent normalement.") : worst === "outage" ? tr("Une panne est en cours sur au moins un service.") : tr("Certains services sont dégradés ou en maintenance."); o.className = "notice" + (worst === "operational" ? "" : " warn"); o.hidden = false; } else o.hidden = true;
    $("checked").textContent = fmt(Date.now());
  }
  await load(); setInterval(load, 60000);
});
</script>
</body></html>
