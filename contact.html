<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact · Aldetic Frontiers</title>
<meta name="description" content="Aldetic Frontiers Ltd : Technology Beyond Limits.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600&family=IBM+Plex+Sans:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<script>try{var t=localStorage.getItem('aldetic-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script></head>
<body data-protected="false">
<div id="site-header"></div>
<main>
<section class="h-hero" style="padding-bottom:32px">
  <div class="wrap h-two">
    <div>
      <p class="eyebrow">Contact</p>
      <h1 style="font-size:clamp(36px,5.4vw,60px)">Écrivez à la bonne équipe.</h1>
      <p class="lead" style="margin-top:18px">Choisissez un sujet pour que votre message parvienne à l'équipe concernée.</p>
    </div>
    <div class="h-list card-list">
      <div class="h-row"><span class="h-row-meta"><strong>Adresse e-mail</strong><small>À publier une fois confirmée</small></span></div>
      <div class="h-row"><span class="h-row-meta"><strong>Réponse</strong><small>Sous quelques jours ouvrés</small></span></div>
    </div>
  </div>
</section>
<section style="padding-top:8px">
  <div class="wrap" style="max-width:720px">
    <form id="cf" class="panel" novalidate>
      <div class="field"><label for="cn">Nom</label><input id="cn" autocomplete="name" maxlength="80" required><p class="err" id="ce1"></p></div>
      <div class="field"><label for="ce">E-mail</label><input id="ce" type="email" autocomplete="email" maxlength="120" required><p class="err" id="ce2"></p></div>
      <div class="field"><label for="cm">Message</label><textarea id="cm" maxlength="2000" required></textarea><p class="err" id="ce3"></p></div>
      <p class="notice warn" id="cres" role="status" hidden></p>
      <button class="btn primary" type="submit" style="margin-top:14px;width:100%">Envoyer</button>
    </form>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script>
document.addEventListener("aldetic:ready", () => {
  document.getElementById("cf").addEventListener("submit", e => {
    e.preventDefault();
    const n = cn.value.trim(), m = ce.value, msg = cm.value.trim();
    ce1.textContent = n.length < 2 ? tr("Indiquez votre nom.") : "";
    ce2.textContent = /^\S+@\S+\.\S+$/.test(m) ? "" : tr("Adresse e-mail invalide.");
    ce3.textContent = msg.length < 10 ? tr("Message trop court (10 caractères minimum).") : "";
    if (ce1.textContent || ce2.textContent || ce3.textContent) return;
    const r = document.getElementById("cres"); r.hidden = false;
    r.textContent = window.aldeticDb ? tr("Message envoyé.") : tr("Envoi indisponible : le service de messagerie n'est pas encore branché. Votre message n'a pas été transmis.");
  });
});
</script>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/i18n-en.js"></script>
<script src="assets/js/i18n-es.js"></script>
<script src="assets/js/i18n-pt.js"></script>
<script src="assets/js/i18n-ar.js"></script>
<script src="assets/js/i18n-de.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/ask-ai.js"></script>
</body>
</html>
