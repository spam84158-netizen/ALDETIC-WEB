
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact · Aldetic Frontiers</title>
<meta name="description" content="Aldetic Frontiers Ltd : Technology Beyond Limits.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600&family=IBM+Plex+Sans:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
</head>

<body data-protected="false">

<div id="site-header"></div>

<main>
<section class="h-hero" style="padding-bottom:32px">
  <div class="wrap h-two">
    <div>
      <p class="eyebrow">Contact</p>
      <h1 style="font-size:clamp(36px,5.4vw,60px)">Écrivez à la bonne équipe.</h1>
      <p class="lead" style="margin-top:18px">Choisissez un sujet pour que votre message parvienne à l'équipe concernée.</p>
    </div>

    <div class="h-list card-list">
      <div class="h-row">
        <span class="h-row-meta">
          <strong>Adresse e-mail</strong>
          <small>À publier une fois confirmée</small>
        </span>
      </div>
      <div class="h-row">
        <span class="h-row-meta">
          <strong>Réponse</strong>
          <small>Sous quelques jours ouvrés</small>
        </span>
      </div>
    </div>
  </div>
</section>

<section style="padding-top:8px">
  <div class="wrap" style="max-width:720px">

    <form id="cf" class="panel" novalidate>

      <div class="field">
        <label for="cn">Nom</label>
        <input id="cn" autocomplete="name" maxlength="80" required>
        <p class="err" id="ce1"></p>
      </div>

      <div class="field">
        <label for="ce">E-mail</label>
        <input id="ce" type="email" autocomplete="email" maxlength="120" required>
        <p class="err" id="ce2"></p>
      </div>

      <div class="field">
        <label for="cm">Message</label>
        <textarea id="cm" maxlength="2000" required></textarea>
        <p class="err" id="ce3"></p>
      </div>

      <p class="notice warn" id="cres" role="status" hidden></p>

      <button class="btn primary" type="submit" style="margin-top:14px;width:100%">
        Envoyer
      </button>

    </form>
  </div>
</section>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script src="assets/js/config.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/i18n-en.js"></script>
<script src="assets/js/i18n-es.js"></script>
<script src="assets/js/i18n-pt.js"></script>
<script src="assets/js/i18n-ar.js"></script>
<script src="assets/js/i18n-de.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/ask-ai.js"></script>

<script>
document.addEventListener("aldetic:ready", () => {
  const form = document.getElementById("cf");
  if (!form || form.dataset.connected === "true") return;

  form.dataset.connected = "true";

  const nameInput = document.getElementById("cn");
  const emailInput = document.getElementById("ce");
  const messageInput = document.getElementById("cm");
  const status = document.getElementById("cres");
  const button = form.querySelector('button[type="submit"]');

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const name = nameInput.value.trim();
    const email = emailInput.value.trim();
    const message = messageInput.value.trim();

    document.getElementById("ce1").textContent =
      name.length < 2 ? tr("Indiquez votre nom.") : "";

    document.getElementById("ce2").textContent =
      /^\S+@\S+\.\S+$/.test(email)
        ? ""
        : tr("Adresse e-mail invalide.");

    document.getElementById("ce3").textContent =
      message.length < 10
        ? tr("Message trop court (10 caractères minimum).")
        : "";

    if (
      name.length < 2 ||
      !/^\S+@\S+\.\S+$/.test(email) ||
      message.length < 10
    ) {
      return;
    }

    const config = window.ALDETIC_CONFIG;

    if (!config?.SUPABASE_URL || !config?.SUPABASE_ANON_KEY) {
      status.hidden = false;
      status.textContent = tr("Configuration Supabase absente. Message non transmis.");
      return;
    }

    button.disabled = true;
    status.hidden = false;
    status.textContent = tr("Envoi en cours…");

    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 20000);

      let response;

      try {
        response = await fetch(
          `${config.SUPABASE_URL}/functions/v1/contact-message`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": config.SUPABASE_ANON_KEY,
              "Authorization": `Bearer ${config.SUPABASE_ANON_KEY}`
            },
            body: JSON.stringify({ name, email, message }),
            signal: controller.signal
          }
        );
      } finally {
        clearTimeout(timeout);
      }

      const result = await response.json().catch(() => ({}));

      if (!response.ok || result.success !== true) {
        throw new Error(result.error || "Envoi impossible.");
      }

      status.textContent = result.notified
        ? tr("Message envoyé à l'équipe Aldetic.")
        : tr("Message enregistré, mais notification e-mail indisponible.");

      form.reset();

    } catch (error) {
      status.textContent =
        error.name === "AbortError"
          ? tr("Le délai d'envoi est dépassé. Réessayez.")
          : tr("Envoi impossible : ") + (error.message || "erreur serveur");

    } finally {
      button.disabled = false;
    }
  });
});
</script>

</body>
</html>
