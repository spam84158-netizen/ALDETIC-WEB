<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projets · Aldetic Frontiers</title>
<meta name="description" content="Aldetic Frontiers Ltd : Technology Beyond Limits.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600&family=IBM+Plex+Sans:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
</head>
<body data-protected="false">
<div id="site-header"></div>
<main>
<section class="h-hero" style="padding-bottom:32px">
  <div class="wrap">
    <p class="eyebrow">Projets</p>
    <h1 style="font-size:clamp(36px,5.4vw,60px)">Projets publics.</h1>
    <p class="lead" style="margin-top:18px">Réalisations publiées par leurs auteurs, communauté et Aldetic.</p>
  </div>
</section>
<section style="padding-top:12px">
  <div class="wrap">
    <input id="pq" class="search-field" type="search" placeholder="Rechercher un projet" aria-label="Rechercher un projet">
    <div id="plist" class="h-list card-list" style="margin-top:20px"></div>
    <p id="pempty" class="empty" hidden>Aucun projet public pour le moment.</p>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script>
(() => {
  const items = [];
  const list = document.getElementById("plist"), q = document.getElementById("pq"), empty = document.getElementById("pempty");
  const esc = s => s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const render = () => {
    const v = q.value.trim().toLowerCase();
    const shown = items.filter(p => p.name.toLowerCase().includes(v));
    list.innerHTML = shown.map(p => `<div class="h-row"><span class="h-row-meta"><strong>${esc(p.name)}</strong><small>${esc(p.desc)}</small></span></div>`).join("");
    empty.hidden = shown.length > 0;
  };
  q.addEventListener("input", render);
  render();
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/i18n-en.js"></script>
<script src="assets/js/i18n-es.js"></script>
<script src="assets/js/i18n-pt.js"></script>
<script src="assets/js/i18n-ar.js"></script>
<script src="assets/js/i18n-de.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/ask-ai.js"></script>

</body>
</html>
