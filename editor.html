<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/base.css"><script>try{var t=localStorage.getItem('aldetic-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script></head>
<body data-protected="true"><div id="site-header"></div><main><section class="h-hero" style="padding-bottom:18px"><div class="wrap"><img class="hero-art" src="assets/brand/illustrations/code.svg" alt="" width="150" height="131"><p class="eyebrow">MY EDITOR</p><h1 id="ed-title" style="font-size:clamp(30px,4.6vw,50px)">Éditeur</h1><p class="lead" style="margin-top:14px"><span id="ed-mode" class="pill"></span> <a href="projets.html" class="muted">← Projets</a></p></div></section>
<section style="padding-top:4px"><div class="wrap">
<p id="state" class="notice" hidden></p>
<div id="ed-app" hidden>
<div class="ed-grid">
<aside class="panel ed-files"><div class="ed-tools"><button type="button" class="btn small ghost" id="ed-new" data-writer>Nouveau</button><button type="button" class="btn small ghost" id="ed-rename" data-writer>Renommer</button><button type="button" class="btn small ghost" id="ed-delete" data-writer>Supprimer</button></div>
<form id="ed-name-form" hidden class="field"><label for="ed-name">Nom du fichier</label><input id="ed-name" maxlength="200" autocomplete="off" placeholder="dossier/fichier.js"><button class="btn small primary" type="submit" style="margin-top:8px">OK</button></form>
<ul id="ed-tree" class="ed-tree"></ul></aside>
<div class="panel ed-main">
<div class="ed-bar"><div id="ed-tabs" class="ed-tabs" role="tablist"></div><span class="pill" id="ed-lang"></span></div>
<div class="ed-find"><input id="ed-q" type="search" placeholder="Rechercher dans le fichier" aria-label="Rechercher dans le fichier"><button type="button" class="btn small ghost" id="ed-next">Suivant</button><span id="ed-hits" class="muted"></span><span style="flex:1"></span><button type="button" class="btn small ghost" id="ed-history">Historique</button><button type="button" class="btn small primary" id="ed-save" data-writer disabled>Enregistrer</button></div>
<p id="ed-empty" class="empty">Ouvrez un fichier dans la liste.</p>
<div id="ed-box" class="ed-box" hidden><pre id="ed-gutter" class="ed-gutter" aria-hidden="true"></pre><div class="ed-stack"><pre id="ed-hl" class="ed-code" aria-hidden="true"></pre><textarea id="ed-ta" class="ed-code" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Contenu du fichier"></textarea></div></div>
<p id="ed-status" class="muted" role="status" style="margin-top:8px"></p>
<aside id="ed-hist" hidden class="ed-hist"><h4>Versions</h4><ul id="ed-hist-list"></ul></aside>
</div></div></div>
</div></section>
