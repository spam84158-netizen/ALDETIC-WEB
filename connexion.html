<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connexion · Aldetic Frontiers</title>
<meta name="description" content="Aldetic Frontiers Ltd : Technology Beyond Limits.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600&family=IBM+Plex+Sans:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<script>try{var t=localStorage.getItem('aldetic-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script></head>
<body data-protected="false">
<div id="site-header"></div>
<main>
<section style="padding-top:clamp(64px,9vw,112px);border:0">
  <div class="wrap" style="max-width:440px">
    <p class="eyebrow">Compte</p>
    <h1 style="font-size:clamp(40px,5vw,56px)">Connexion</h1>
    <form id="auth-form" data-mode="login" style="margin-top:32px" novalidate>
      <div class="field"><label for="em">E-mail</label><input id="em" name="email" type="email" required autocomplete="email"></div>
      <div class="field"><label for="pw">Mot de passe</label><input id="pw" name="password" type="password" required minlength="8" autocomplete="current-password"></div>
      <button class="btn primary" type="submit" style="width:100%">Se connecter</button>
      <button class="btn ghost" type="button" data-oauth="google" style="width:100%;margin-top:12px">Continuer avec Google</button>
      <button class="btn ghost" type="button" data-oauth="github" style="width:100%;margin-top:12px">Continue with GitHub</button>
    <p style="text-align:right;margin:10px 0 0;font-size:14px"><a href="mot-de-passe-oublie.html">Mot de passe oublié ?</a></p>
    </form>
    <p id="auth-msg" class="notice warn" hidden style="margin-top:16px"></p>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/i18n-en.js"></script>
<script src="assets/js/i18n-es.js"></script>
<script src="assets/js/i18n-pt.js"></script>
<script src="assets/js/i18n-ar.js"></script>
<script src="assets/js/i18n-de.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/ask-ai.js"></script>
</body>
</html>
