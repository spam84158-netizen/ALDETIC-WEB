<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mot de passe oublié · Aldetic Frontiers</title><meta name="description" content="Demandez un lien sécurisé pour réinitialiser votre mot de passe Aldetic."><link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/base.css"></head>
<body data-protected="false"><div id="site-header"></div><main>
<section class="h-hero" style="padding-bottom:30px"><div class="wrap"><div class="module-heading"><img src="assets/brand/logos/mot-de-passe.svg" alt="Logo Mot de passe oublié" width="64" height="64"><div><p class="eyebrow">Récupération du compte</p><h1 style="font-size:clamp(34px,5vw,58px)">Retrouvez l’accès à votre compte.</h1></div></div><p class="lead" style="margin-top:18px">Demandez un lien sécurisé pour réinitialiser votre mot de passe Aldetic.</p></div></section>
<section style="padding-top:12px"><div class="wrap"><div class="panel" style="max-width:540px;margin:0 auto"><p class="muted">Saisissez l'adresse associée à votre compte. Si Supabase Auth et les e-mails sont configurés, un lien de réinitialisation pourra être envoyé.</p><form id="reset-form"><div class="field"><label for="reset-email">Adresse e-mail</label><input id="reset-email" type="email" autocomplete="email" required placeholder="vous@exemple.com"></div><button class="btn primary" type="submit" style="width:100%">Envoyer le lien de récupération</button></form><p id="reset-status" class="notice warn" hidden role="status" style="margin-top:16px"></p><p class="muted" style="margin-top:16px;font-size:13px">Retour à la <a href="connexion.html">connexion</a>.</p></div></div></section></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js"></script><script src="assets/js/supabase.js"></script>
<script src="assets/js/i18n-en.js"></script><script src="assets/js/i18n-es.js"></script><script src="assets/js/i18n-pt.js"></script><script src="assets/js/i18n-ar.js"></script><script src="assets/js/i18n-de.js"></script>
<script src="assets/js/app.js"></script><script src="assets/js/motion.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/ask-ai.js"></script><script>document.addEventListener('aldetic:ready',()=>document.getElementById('reset-form').addEventListener('submit',async e=>{e.preventDefault();const out=document.getElementById('reset-status');out.hidden=false;if(!window.aldeticDb){out.textContent='Récupération indisponible : Supabase Auth n’est pas encore configuré. Aucun e-mail n’a été envoyé.';return;}const email=document.getElementById('reset-email').value.trim();const {error}=await window.aldeticDb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/connexion.html'});out.textContent=error?'Impossible d’envoyer le lien : '+error.message:'Si cette adresse correspond à un compte, un e-mail de récupération va être envoyé.';}));</script></body></html>
